[package]
name = "musicdb"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
authors = ["Pedro Macedo <pedro@pedromacedo.com>"]
license = "Apache-2.0"
description = "Apple Music .musicdb parser, inspector, and format analysis toolkit"
readme = "README.md"
keywords = ["apple-music", "itunes", "musicdb", "musiclibrary", "parser"]
categories = [
  "multimedia::audio",
  "parser-implementations",
  "command-line-utilities",
]
repository = "https://github.com/pedrohgmacedo/musicdb"
include = ["src/**/*", "examples/**/*", "Cargo.toml", "LICENSE", "NOTICE", "README.md"]

[[bin]]
name = "musicdb"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "musicdb"

[features]
default = ["serde", "sqlite", "cli"]
serde = ["dep:serde", "bitflags/serde", "jiff/serde"]
sqlite = ["dep:rusqlite", "serde", "dep:serde_json"]
cli = [
  "dep:anyhow",
  "dep:clap",
  "dep:clap_complete",
  "dep:directories",
  "dep:serde_json",
  "dep:tar",
  "serde",
  "sqlite",
]
adhoc = ["cli"]

[dependencies]
aes = "0.9.3"
anyhow = { version = "1.0.104", optional = true }
binrw = "0.15.2"
bitflags = "2.13.2"
cipher = "0.5.2"
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
directories = { version = "6.0.0", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hex = "0.4.3"
jiff = { version = "1.0.0", default-features = false }
plist = "1.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tar = { version = "0.4.44", optional = true }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.20.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

