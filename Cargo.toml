[package]
name = "musicdb-rs"
version = "1.0.0"
edition = "2024"
authors = ["Pedro Macedo <pedro@pedromacedo.com>"]
license = "Apache-2.0"
description = "Apple Music .musicdb parser, inspector, and format analysis toolkit"
readme = "README.md"
keywords = ["apple-music", "itunes", "musicdb", "musiclibrary", "parser"]
categories = ["multimedia::audio", "parser-implementations", "command-line-utilities"]
repository = "https://github.com/pedrohgmacedo/musicdb-rs"

[[bin]]
name = "musicdb"
path = "src/main.rs"

[lib]
name = "musicdb"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
binrw = "0.15.2"
bitflags = { version = "2.13.2", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
cipher = "0.5.2"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
plist = "1.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
